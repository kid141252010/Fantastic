<div class="page">
  <main>

    <div class="qq-artist-counts" id="counts"></div>

    <section class="tracklist qq-artist-songs" id="tracks" hidden></section>
    <div class="album-footer" id="footer" hidden></div>
    <div id="shelves"></div>
  </main>
