<div class="page qq-mv-page">
  <main>
    <section class="qq-mv-screen">
      <video id="video" controls playsinline preload="metadata" referrerpolicy="no-referrer"></video>
    </section>
    <div class="alert error" id="alert" hidden aria-live="polite"></div>
    <section class="qq-mv-info">
      <h1 class="qq-mv-title" id="title" data-i18n="qq.mvTitle"></h1>
      <p class="qq-mv-artist" id="artist"></p>
      <p class="qq-mv-meta" id="meta"></p>
      <div class="qq-mv-actions" id="actions">
        <a class="song-reparse" id="open" target="_blank" rel="noreferrer" hidden data-i18n="qq.openVideo"></a>
      </div>
      <p class="qq-mv-desc" id="desc" hidden></p>
    </section>
  </main>
</div>
